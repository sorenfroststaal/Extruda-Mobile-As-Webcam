name: Security checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dependencies-and-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild workerd
      - run: pnpm audit --audit-level=moderate
      - name: Start isolated local service
        run: |
          pnpm exec wrangler dev --port 8787 --persist-to .wrangler/ci > /tmp/extruda-worker.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/extruda-worker.log
          exit 1
      - run: node --test test/*.test.js
